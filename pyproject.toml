[project]
name = "sf-rag-kb"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # LLM 编排
  "langchain==0.3.*",
  "langchain-community==0.3.*",
  "langchain-openai==0.2.*",
  # Embedding & Rerank
  "FlagEmbedding>=1.3.0",
  "sentence-transformers>=3.0",
  # 存储
  "pymilvus==2.4.*",
  "elasticsearch==8.15.*",
  "neo4j>=5.20",
  "redis>=5.0",
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  # 工具
  "python-dotenv>=1.0",
  "tenacity>=9.0",
  "loguru>=0.7",
  "tqdm>=4.66",
  # 评估
  "ragas>=0.2.0",
  "datasets>=3.0",
  # 图相关
  "networkx>=3.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
