[project]
name = "sf-rag-kb"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # LLM 编排
  "langchain==0.3.*",
  "langchain-community==0.3.*",
  "langchain-openai==0.2.*",
  # Embedding & Rerank
  "FlagEmbedding>=1.3.0",
  "sentence-transformers>=3.0",
  "torch>=2.4",   # 显式声明,从 PyTorch CUDA 索引装(见下方 tool.uv.sources)
  # 存储
  "pymilvus==2.4.*",
  "elasticsearch==8.15.*",
  "neo4j>=5.20",
  "redis>=5.0",
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  # 工具
  "python-dotenv>=1.0",
  "tenacity>=9.0",
  "loguru>=0.7",
  "tqdm>=4.66",
  # 评估
  "ragas>=0.2.0",
  "datasets>=3.0",
  # 图相关
  "networkx>=3.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PyTorch CUDA 12.8 索引(RTX 4060 + 驱动 591.86 / CUDA 13.1 兼容)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
